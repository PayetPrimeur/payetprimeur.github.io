# Sauvegarde des stocks de l'appli Payet Primeur Pro, à 22 h (heure de Paris)
# les mardis, jeudis, vendredis et samedis soir. La sauvegarde est rangée dans
# la base Firebase (sauvegardes/stocks/<date>) : l'appli l'affiche dans l'admin
# (PDF, restauration et statistiques). Les sauvegardes de plus de 400 jours sont effacées.
name: Sauvegarde des stocks

on:
  schedule:
    # deux horaires UTC pour tomber à 22 h à Paris en hiver (UTC+1) comme en été (UTC+2) ;
    # le script ne garde que celui qui tombe à 22 h, heure de Paris
    - cron: "2 20,21 * * 2,4,5,6"
  workflow_dispatch:
    inputs:
      forcer:
        description: "Faire une sauvegarde maintenant (même hors horaire)"
        type: boolean
        default: false

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _outils

      - name: Jeton d'accès Firebase
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # sans le secret, on lit comme avant (base ouverte) ; avec, on passe par le compte de service
          if [ -n "${SA:-}" ]; then
            pip install -q google-auth requests
            # en cas de clé illisible, on continue sans (tant que la base est ouverte) et on le signale
            if T=$(python3 _outils/jeton_firebase.py); then
              echo "::add-mask::$T"
              echo "FB_AUTH=?access_token=$T" >> "$GITHUB_ENV"
            else
              echo "::warning::Clé FIREBASE_SERVICE_ACCOUNT illisible : lecture sans jeton."
              echo "FB_AUTH=" >> "$GITHUB_ENV"
            fi
          else
            echo "FB_AUTH=" >> "$GITHUB_ENV"
          fi

      - name: Sauvegarder les stocks
        env:
          FORCER: ${{ inputs.forcer }}
        run: |
          set -euo pipefail
          HEURE=$(TZ=Europe/Paris date +%H)
          JOUR=$(TZ=Europe/Paris date +%u)   # 1 = lundi … 7 = dimanche
          if [ "${FORCER:-false}" != "true" ]; then
            case "$JOUR" in 2|4|5|6) ;; *) echo "Pas de sauvegarde ce soir."; exit 0;; esac
            if [ "$HEURE" != "22" ]; then echo "Heure de Paris : $HEURE h, l'autre déclenchement s'en charge."; exit 0; fi
          fi
          DATE=$(TZ=Europe/Paris date +%Y-%m-%d)
          BASE="https://stock-romain-default-rtdb.europe-west1.firebasedatabase.app"
          curl -sSf --retry 3 "$BASE/stocks.json$FB_AUTH" -o stocks.json
          python3 - "$DATE" <<'EOF'
          import json, sys, datetime
          stocks = json.load(open("stocks.json")) or {}
          json.dump({"stocks": stocks, "le": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")},
                    open("sauvegarde.json", "w"), ensure_ascii=False)
          print(f"{len(stocks)} produits sauvegardés pour le {sys.argv[1]}")
          EOF
          curl -sSf --retry 3 -X PUT -H "Content-Type: application/json" --data @sauvegarde.json "$BASE/sauvegardes/stocks/$DATE.json$FB_AUTH" > /dev/null
          # nouvelle liste à cocher pour cette date : on repart de cases vides
          curl -sSf -X DELETE "$BASE/coches/$DATE.json$FB_AUTH" > /dev/null || true
          # ménage : on garde 400 jours (environ 13 mois, pour les statistiques sur un an)
          LIMITE=$(TZ=Europe/Paris date -d "400 days ago" +%Y-%m-%d)
          curl -sSf "$BASE/sauvegardes/stocks.json?shallow=true${FB_AUTH:+&${FB_AUTH#?}}" -o liste.json
          python3 -c "import json; print('\n'.join(k for k in (json.load(open('liste.json')) or {}) if k < '$LIMITE'))" | while read -r K; do
            if [ -n "$K" ]; then curl -sSf -X DELETE "$BASE/sauvegardes/stocks/$K.json$FB_AUTH" > /dev/null; echo "Ancienne sauvegarde effacée : $K"; fi
          done
          # coches de la liste à cocher : on garde 30 jours
          LIMC=$(TZ=Europe/Paris date -d "30 days ago" +%Y-%m-%d)
          curl -sSf "$BASE/coches.json?shallow=true${FB_AUTH:+&${FB_AUTH#?}}" -o coches.json || echo "{}" > coches.json
          python3 -c "import json; print('\n'.join(k for k in (json.load(open('coches.json')) or {}) if k < '$LIMC'))" | while read -r K; do
            if [ -n "$K" ]; then curl -sSf -X DELETE "$BASE/coches/$K.json$FB_AUTH" > /dev/null; fi
          done
          echo "Sauvegarde du $DATE enregistrée."
