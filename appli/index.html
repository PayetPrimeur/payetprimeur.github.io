<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com https://*.firebasedatabase.app https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://i.ibb.co; connect-src 'self' https://*.firebasedatabase.app wss://*.firebasedatabase.app https://*.googleapis.com https://payetprimeur.github.io; frame-src https://*.firebaseapp.com https://*.firebasedatabase.app; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Payet Primeur Pro</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/CK46GbS2/515506195-18231841738288881-6877506158939999563-n.jpg">
    <link rel="apple-touch-icon" href="https://i.ibb.co/CK46GbS2/515506195-18231841738288881-6877506158939999563-n.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&display=swap">
    <link rel="stylesheet" href="style.css?v=202611100240">
    <link rel="stylesheet" href="qr.css?v=202611100240">
    <link rel="stylesheet" href="stats.css?v=202611100240">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="locked">

<!-- CONNEXION -->
<section id="view-login" aria-label="Connexion">
    <form id="login-form" class="login-card" novalidate>
        <img src="logo-payet.png" alt="Payet Primeur" class="login-logo">
        <h1>Payet Primeur Pro</h1>
        <p class="hint">Connectez-vous pour accéder aux stocks et aux commandes.</p>
        <label class="field">E-mail<input id="login-email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false"></label>
        <label class="field">Mot de passe<span class="pw-wrap"><input id="login-pw" type="password" autocomplete="current-password"><button type="button" id="login-show" class="link">Afficher</button></span></label>
        <p class="err" id="login-err" role="alert"></p>
        <button type="submit" class="btn main wide" id="login-btn">Se connecter</button>
        <button type="button" class="link" id="login-forgot">Mot de passe oublié ?</button>
    </form>
</section>

<!-- STOCK -->
<section id="view-stock" class="view active" aria-label="Stocks nécessaires">
    <header class="top"><div class="wrap" style="display:grid;gap:12px">
        <div class="top-row">
            <div><div class="eyebrow">Payet Primeur</div><h1>Stocks nécessaires</h1></div>
            <button type="button" class="icon-btn" id="pdf-btn" aria-label="Exporter les stocks nécessaires en PDF">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
            </button>
        </div>
        <div class="seg" id="site-seg" role="group" aria-label="Boutique">
            <button type="button" data-site="st-selve" aria-pressed="true">St Selve</button>
            <button type="button" data-site="villenave" aria-pressed="false">Villenave</button>
        </div>
        <div class="chips" id="cat-chips" role="group" aria-label="Catégories"></div>
    </div></header>
    <div class="content" id="stock-list"></div>
</section>

<!-- COMMANDES -->
<section id="view-agenda" class="view" aria-label="Commandes">
    <header class="top"><div class="wrap" style="display:grid;gap:12px">
        <div class="top-row">
            <div><div class="eyebrow" id="week-label"></div><h1>Commandes</h1></div>
            <div style="display:flex;gap:6px">
                <button type="button" class="icon-btn" id="prev-week" aria-label="Mois précédent"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
                <button type="button" class="icon-btn" id="today-btn" aria-label="Revenir à aujourd'hui" style="width:auto;padding:0 12px;font-weight:800;font-size:13px">Auj.</button>
                <button type="button" class="icon-btn" id="next-week" aria-label="Mois suivant"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
            </div>
        </div>
        <div class="week" id="week" role="group" aria-label="Jours du mois"></div>
    </div></header>
    <div class="content" id="orders"></div>
</section>
<button type="button" class="fab hidden" id="fab">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>Nouvelle commande
</button>

<!-- ADMIN -->
<section id="view-admin" class="view" aria-label="Admin">
    <header class="top"><div class="wrap"><div class="top-row">
        <div><div class="eyebrow">Payet Primeur</div><h1 id="admin-title">Admin</h1></div>
    </div></div></header>
    <div class="content">
        <section class="card">
            <div class="card-head"><h2>Mon compte</h2><span id="acct-role"></span></div>
            <p class="acct-email" id="acct-email"></p>
            <div class="two"><button type="button" class="btn wide" id="pw-btn">Changer le mot de passe</button><button type="button" class="btn wide" id="logout-btn">Se déconnecter</button></div>
        </section>
        <div class="admin-only">
        <div class="tiles">
            <button type="button" class="tile-main" id="qr-btn">
                <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3z"/><path d="M20 14v7"/><path d="M14 20h3"/></svg></span>
                <span class="t"><b>QR codes &amp; recettes</b><small>Produits en vente, paniers, étiquettes</small></span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
            </button>
            <button type="button" class="tile-main alt" id="stats-btn">
                <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg></span>
                <span class="t"><b>Statistiques</b><small>Stocks nécessaires et commandes</small></span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
            </button>
            <button type="button" class="tile" id="pdf-btn-2">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>Export PDF des stocks nécessaires
            </button>
            <button type="button" class="tile danger" id="reset-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Remettre à zéro
            </button>
        </div>

        <section class="card">
            <div class="card-head"><h2>Sauvegardes des stocks nécessaires</h2><span>mar., jeu., ven., sam. à minuit</span></div>
            <div id="backups" style="display:grid;gap:8px"></div>
        </section>

        <section class="card">
            <h2>Ajouter au catalogue</h2>
            <label class="field">Nom du produit<input type="text" id="new-p-name" placeholder="Ex : Poire williams" autocomplete="off"></label>
            <div class="pick" id="new-cat" role="group" aria-label="Catégorie"></div>
            <p class="err" id="new-p-err" role="alert"></p>
            <button type="button" class="btn dark wide" id="add-btn">Ajouter</button>
        </section>

        <section class="card" style="gap:0">
            <div class="card-head" style="padding-bottom:6px"><h2>Catalogue</h2><span id="cat-count"></span></div>
            <div id="catalogue"></div>
        </section>
        </div>
    </div>
</section>

<nav class="nav" aria-label="Navigation"><div>
    <button type="button" data-go="stock" aria-current="page">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4"/><path d="M3 17l9 4 9-4"/></svg>Stocks
    </button>
    <button type="button" data-go="agenda">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>Commandes
    </button>
    <button type="button" data-go="admin">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="M2 12h3"/><path d="M19 12h3"/><path d="m4.9 4.9 2.1 2.1"/><path d="m17 17 2.1 2.1"/><path d="m4.9 19.1 2.1-2.1"/><path d="m17 7 2.1-2.1"/></svg><span class="lbl">Admin</span>
    </button>
</div></nav>

<script src="app.js?v=202611100240"></script>
<script src="qr-liens.js?v=202611100240"></script>
<script src="qr.js?v=202611100240"></script>
<script src="stats.js?v=202611100240"></script>
</body>
</html>
